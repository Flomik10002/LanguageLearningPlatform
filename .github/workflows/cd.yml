name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: /opt/flomik-labs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test before deploy
        run: npm run ci:smoke

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Upload app to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "server/data" \
            -e "ssh -p ${SSH_PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:${APP_DIR}/"

      - name: Install production deps and restart service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "set -euo pipefail; \
            if [ \"\$(id -u)\" -eq 0 ]; then SUDO=''; else SUDO='sudo -n'; fi; \
            NODE_MAJOR=\"\$(node -p 'process.versions.node.split(\".\")[0]')\"; \
            if [ \"\${NODE_MAJOR}\" -lt 22 ]; then \
              echo 'Node.js 22+ is required on server. Install it once, then rerun CD.' >&2; \
              echo 'Example: curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs' >&2; \
              exit 1; \
            fi; \
            cd '${APP_DIR}'; \
            if [ ! -f .env ]; then cp deploy/env/.env.example .env; fi; \
            \${SUDO} mkdir -p /var/lib/flomik-labs /var/backups/flomik-labs; \
            \${SUDO} chown -R www-data:www-data /var/lib/flomik-labs /var/backups/flomik-labs; \
            npm ci --omit=dev; \
            \${SUDO} cp deploy/systemd/flomik-labs.service /etc/systemd/system/flomik-labs.service; \
            \${SUDO} systemctl daemon-reload; \
            \${SUDO} systemctl enable flomik-labs >/dev/null; \
            \${SUDO} systemctl restart flomik-labs; \
            HEALTH_OK=0; \
            for i in \$(seq 1 30); do \
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then \
                HEALTH_OK=1; \
                break; \
              fi; \
              sleep 1; \
            done; \
            if [ \"\${HEALTH_OK}\" -ne 1 ]; then \
              echo 'Health check failed. Service diagnostics:' >&2; \
              \${SUDO} systemctl status flomik-labs --no-pager -l >&2 || true; \
              \${SUDO} journalctl -u flomik-labs -n 120 --no-pager >&2 || true; \
              exit 1; \
            fi"
